      mix deps.get &&
      mix test.watch"

  project03:
    image: elixir:1.19.5
    working_dir: /app/projects/project-03-realtime-chat-server
    environment:
      - PHX_SERVER=true
      - PORT=4000
    volumes:
      - ./:/app
      - project03_deps:/app/projects/project-03-realtime-chat-server/deps
      - project03_build:/app/projects/project-03-realtime-chat-server/_build
    ports:
      - "4003:4000"
    command: >
      sh -lc "mix local.hex --force &&
      mix local.rebar --force &&
      mix deps.get &&
      mix phx.server"

