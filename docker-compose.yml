services:
  project01:
    image: elixir:1.19.5
    working_dir: /app/projects/project-01-cli-task-utility
    volumes:
      - ./:/app
      - project01_deps:/app/projects/project-01-cli-task-utility/deps
      - project01_build:/app/projects/project-01-cli-task-utility/_build
    command: >
      sh -lc "mix local.hex --force &&
      mix local.rebar --force &&
      mix deps.get &&
      mix test.watch"

