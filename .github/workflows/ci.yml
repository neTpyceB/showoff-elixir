name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      project01: ${{ steps.filter.outputs.project01 }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            project01:
              - 'projects/project-01-cli-task-utility/**'
              - '.github/workflows/ci.yml'

  project01:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.project01 == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"
      - name: Project 01 tests
        working-directory: projects/project-01-cli-task-utility
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix test
