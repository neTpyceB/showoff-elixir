name: ci

on:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      project01: ${{ steps.filter.outputs.project01 }}
      project02: ${{ steps.filter.outputs.project02 }}
      project03: ${{ steps.filter.outputs.project03 }}
      project04: ${{ steps.filter.outputs.project04 }}
      project05: ${{ steps.filter.outputs.project05 }}
      project06: ${{ steps.filter.outputs.project06 }}
      project07: ${{ steps.filter.outputs.project07 }}
      project08: ${{ steps.filter.outputs.project08 }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            project01:
              - 'projects/project-01-cli-task-utility/**'
            project02:
              - 'projects/project-02-concurrent-web-scraper/**'
            project03:
              - 'projects/project-03-realtime-chat-server/**'
            project04:
              - 'projects/project-04-live-dashboard-system/**'
            project05:
              - 'projects/project-05-fault-tolerant-job-processing-system/**'
            project06:
              - 'projects/project-06-multiplayer-game-backend/**'
            project07:
              - 'projects/project-07-distributed-notification-platform/**'
            project08:
              - 'projects/project-08-event-driven-saas-backend/**'

  project01:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.project01 == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"
      - name: Project 01 tests
        working-directory: projects/project-01-cli-task-utility
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix test

  project02:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.project02 == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
