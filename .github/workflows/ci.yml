name: ci

on:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      project01: ${{ steps.filter.outputs.project01 }}
      project02: ${{ steps.filter.outputs.project02 }}
      project03: ${{ steps.filter.outputs.project03 }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            project01:
              - 'projects/project-01-cli-task-utility/**'
            project02:
              - 'projects/project-02-concurrent-web-scraper/**'
            project03:
              - 'projects/project-03-realtime-chat-server/**'

  project01:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.project01 == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"
      - name: Project 01 tests
        working-directory: projects/project-01-cli-task-utility
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix test

  project02:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.project02 == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"
      - name: Project 02 tests
        working-directory: projects/project-02-concurrent-web-scraper
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix test

  project03:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.project03 == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"
      - name: Project 03 tests
        working-directory: projects/project-03-realtime-chat-server
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix test
